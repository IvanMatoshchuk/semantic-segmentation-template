[project]
name = "semantic-segmentation-template"
version = "0.1.0"
description = "Template for training semantic segmentation models with PyTorch Lightning and Hydra."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.8",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "monai>=1.5.1",
    "opencv-python>=4.12.0.88",
    "pytorch-lightning>=2.6.0",
    "rich>=14.2.0",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "segmentation-models-pytorch>=0.5.0",
    "wandb>=0.23.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
